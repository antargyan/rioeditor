name: Publish the macOS DMG

# Produces a signed, notarized, stapled DMG and attaches it to a GitHub Release. Notarization
# is not optional cosmetics: without it Gatekeeper refuses to open the app on another machine,
# and that is not a warning a user can reasonably click through.
#
# The Mac App Store is a separate route needing a Mac App Distribution certificate and its own
# app record; not covered here.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # needed to create the release and attach the DMG

env:
  # Not a secret: the team identifier is embedded in every signed binary.
  TEAM_ID: 38N8GYJUC7

jobs:
  publish:
    name: Build, notarize and release
    runs-on: macos-26
    environment: apple-developer-id

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Check the tag matches RioVersion
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          rio=$(sed -n 's:.*<RioVersion>\(.*\)</RioVersion>.*:\1:p' Directory.Build.props | head -1 | tr -d ' ')
          if [ "$tag" != "$rio" ]; then
            echo "Tag '$tag' does not match RioVersion '$rio' in Directory.Build.props." >&2
            exit 1
          fi
          echo "tag $tag matches RioVersion $rio"

      - name: Install the macOS workload
        run: sudo dotnet workload install macos

      # Developer ID Application, not Apple Distribution: a direct download is signed with a
      # different certificate from an App Store build.
      - uses: Apple-Actions/import-codesign-certs@v7.0.0
        with:
          keychain: rioeditor-macos
          create-keychain: true
          p12-file-base64: ${{ secrets.MACOS_DEVELOPER_ID_CERT_P12 }}
          p12-password: ${{ secrets.MACOS_DEVELOPER_ID_CERT_PASSWORD }}

      # CreatePackage=false: publish defaults it to true on macOS and builds an installer .pkg,
      # which this DMG pipeline never uses. The .app is what gets signed.
      # Without this, signing fails with "unable to build chain to self-signed root" and then
      # errSecInternalComponent. A runner keychain holds Apple's roots but not necessarily the
      # Developer ID intermediate, and a .p12 only carries the chain if it was exported with one.
      - name: Install Apple's intermediate certificates
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL -o DeveloperIDG2CA.cer https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          curl -fsSL -o AppleWWDRCAG3.cer  https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
          for cert in DeveloperIDG2CA AppleWWDRCAG3; do
            # A duplicate import is not an error worth failing on; the signature assertion below
            # is what actually proves the chain resolved.
            security import "$cert.cer" -k rioeditor-macos.keychain-db -T /usr/bin/codesign 2>/dev/null || true
          done
          security find-certificate -a -c "Developer ID Certification Authority" >/dev/null \
            || { echo "::error::Developer ID intermediate not present after import"; exit 1; }

      - name: Build the .app
        run: |
          dotnet publish src/RioEditor.Desktop.MacOS -c Release -r osx-arm64 \
            -p:RioBuild=${{ github.run_number }} \
            -p:CreatePackage=false

      # --options runtime enables the hardened runtime, which notarization requires. --deep is
      # deprecated for signing but still the pragmatic way to cover the bundled .NET dylibs.
      - name: Sign
        run: |
          APP=$(find src/RioEditor.Desktop.MacOS/bin/Release -maxdepth 4 -type d -name '*.app' | head -1)
          if [ -z "$APP" ]; then echo "::error::No .app was produced."; exit 1; fi
          echo "APP=$APP" >> "$GITHUB_ENV"
          echo "Signing $APP"

          # Nested code first, bundle last, so the bundle's seal covers already-signed libraries.
          # Apple deprecates --deep for signing; doing it in order is the supported equivalent.
          find "$APP" -type f \( -name '*.dylib' -o -name '*.so' \) -print0 |
            xargs -0 -n1 codesign --force --timestamp --options runtime \
              --sign "Developer ID Application"

          # The entitlements argument is mandatory, not cosmetic: codesign --force rebuilds the
          # signature from scratch and drops whatever the build embedded. Signing hardened without
          # re-applying them ships an app with no JIT entitlement, which notarises cleanly and then
          # fails to launch on the user's machine.
          codesign --force --timestamp --options runtime \
            --entitlements src/RioEditor.Desktop.MacOS/RioEditor.entitlements \
            --sign "Developer ID Application" "$APP"

      # codesign --verify passes on an ad-hoc signature, so on its own it cannot distinguish a
      # properly signed app from one where signing quietly fell back. These assertions can.
      - name: Verify the signature is genuine
        run: |
          codesign --verify --deep --strict --verbose=2 "$APP"
          info=$(codesign -dvvv "$APP" 2>&1)

          echo "$info" | grep -q "Authority=Developer ID Application" \
            || { echo "::error::Not signed by Developer ID Application"; echo "$info"; exit 1; }
          echo "$info" | grep -q "TeamIdentifier=$TEAM_ID" \
            || { echo "::error::TeamIdentifier is missing or unexpected"; echo "$info"; exit 1; }
          echo "$info" | grep -q "Signature=adhoc" \
            && { echo "::error::Signature is ad-hoc"; exit 1; }

          codesign -d --entitlements - "$APP" 2>/dev/null | grep -q "allow-jit" \
            || { echo "::error::JIT entitlement was stripped by signing"; exit 1; }

          echo "Signed by Developer ID, team $TEAM_ID, JIT entitlement intact."

      - name: Build the DMG
        run: |
          mkdir -p dmg-staging
          cp -R "$APP" dmg-staging/
          ln -s /Applications dmg-staging/Applications
          hdiutil create -volname RioEditor -srcfolder dmg-staging -ov -format UDZO RioEditor.dmg
          codesign --force --timestamp --sign "Developer ID Application" RioEditor.dmg

      # notarytool blocks until Apple has finished, so a green step here means the DMG really
      # is notarized rather than merely submitted.
      - name: Notarize and staple
        run: |
          printf '%s' "${{ secrets.ASC_PRIVATE_KEY }}" > "$RUNNER_TEMP/asc.p8"
          xcrun notarytool submit RioEditor.dmg \
            --key "$RUNNER_TEMP/asc.p8" \
            --key-id "${{ secrets.ASC_KEY_ID }}" \
            --issuer "${{ secrets.ASC_ISSUER_ID }}" \
            --wait
          xcrun stapler staple RioEditor.dmg
          xcrun stapler validate RioEditor.dmg
          rm -f "$RUNNER_TEMP/asc.p8"

      - name: Keep the DMG
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-dmg
          path: RioEditor.dmg
          if-no-files-found: error
          retention-days: 30

      # Draft on a manual run so the pipeline can be exercised without announcing anything.
      - name: Attach to a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            gh release create "$GITHUB_REF_NAME" RioEditor.dmg \
              --title "$GITHUB_REF_NAME" --generate-notes --clobber || \
            gh release upload "$GITHUB_REF_NAME" RioEditor.dmg --clobber
          else
            gh release create "dmg-run-${{ github.run_number }}" RioEditor.dmg \
              --title "Manual build ${{ github.run_number }}" --draft --notes 'Manual run; not a release.'
          fi
