name: CI

on:
  push:
    branches: [main]
    # Documentation cannot break a build, and the Apple job is the wall clock for every run.
    # Skipping these keeps prose commits from spinning up three runners to compile bytes that
    # did not change. Anything not listed here still builds everything.
    paths-ignore: ['docs/**', '**.md', 'LICENSE']
  pull_request:
    branches: [main]
    paths-ignore: ['docs/**', '**.md', 'LICENSE']
  workflow_dispatch:

# A newer push makes an in-flight run obsolete, so cancel it rather than queue behind it.
# Cancelling on main is safe as well as faster: history here is linear and every run builds the
# whole tree, so the newest run already covers every commit an older one would have. Without a
# concurrency group these would merely queue, which is slower than either alternative.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  # RioEditor.slnx contains heads that need the macos/ios/android workloads, so a single
  # "build the solution" job cannot work on one runner. Each head is built where it belongs.

  core:
    name: Core, shared UI, desktop and WebAssembly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Install the WebAssembly workload
        run: dotnet workload install wasm-tools

      - name: Build platform-neutral projects
        run: |
          dotnet build src/RioEditor.Core    -c Release --warnaserror
          dotnet build src/RioEditor.App     -c Release --warnaserror
          dotnet build src/RioEditor.Desktop -c Release --warnaserror

      # Built without --warnaserror, unlike every other project here. The WebAssembly workload
      # emits a warning about SkiaSharp/HarfBuzz NativeFileReference items not being linked in
      # (they are not, and do not need to be, because WasmBuildNative is off). It comes from the
      # workload's own targets and carries NO diagnostic code, so neither NoWarn nor
      # -warnnotaserror can exclude it, and --warnaserror turns it into a build failure.
      - name: Build the WebAssembly head
        run: dotnet build src/RioEditor.Browser -c Release

      - name: Publish the WebAssembly site
        run: dotnet publish src/RioEditor.Browser -c Release -o publish/wasm

      - uses: actions/upload-artifact@v7
        with:
          name: wasm-site
          path: publish/wasm/wwwroot
          retention-days: 14

  apple:
    name: macOS and iOS
    # macos-26, not macos-14: .NET for macOS 26.5 requires Xcode 26.6, and this is the first
    # image that has it (and as its default). macos-14 carries 15.4 and macos-15 stops at 26.3,
    # so both fail the SDK's Xcode check before compiling a single file.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Install the Apple workloads
        run: sudo dotnet workload install macos ios

      - name: Build the macOS head
        run: dotnet build src/RioEditor.Desktop.MacOS -c Release

      # Debug, not Release, and deliberately so. This step answers "does it still compile",
      # which does not need the full AOT compilation a Release iOS build performs — that was
      # taking 6.5 of this job's 9 minutes, and the job is the wall clock for the whole run.
      # A Release iOS build belongs in the release pipeline, where the artefact is the point.
      - name: Build the iOS head (simulator)
        run: dotnet build src/RioEditor.iOS -c Debug -f net10.0-ios -r iossimulator-arm64

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: microsoft
          java-version: '17'

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-android-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-android-

      - name: Install the Android workload
        run: dotnet workload install android

      - name: Build the Android head
        # ANDROID_HOME and a JDK are already present on the hosted image.
        run: dotnet build src/RioEditor.Android -c Release
