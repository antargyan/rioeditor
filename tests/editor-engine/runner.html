<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>RioEditor engine tests</title>
  <style>
    body { font: 14px/1.5 -apple-system, system-ui, sans-serif; margin: 0; padding: 16px; }
    #editor { border: 1px solid #ccc; padding: 8px; min-height: 80px; }
    #report { margin-top: 16px; white-space: pre-wrap; font-family: ui-monospace, Menlo, monospace; }
    .pass { color: #1a7f37; } .fail { color: #cf222e; font-weight: 600; }
  </style>
</head>
<body>
  <!--
    The engine is loaded exactly as the app loads it: the highlighter first, because editor.js
    calls into it, then the engine against a real contenteditable in a real browser. jsdom was not
    an option - it implements neither document.execCommand nor enough of Selection and Range for
    any of this to mean anything.
  -->
  <div id="editor" contenteditable="true"><p><br></p></div>

  <div id="report">running…</div>

  <script src="/src/RioEditor.Core/Assets/highlight.js"></script>
  <script src="/src/RioEditor.Core/Assets/editor.js"></script>
  <script src="/tests/editor-engine/tests.js"></script>
</body>
</html>
