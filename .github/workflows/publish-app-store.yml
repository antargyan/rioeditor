name: Publish to TestFlight

# Uploads to TestFlight, never straight to the App Store. Releasing to customers stays a
# deliberate act in App Store Connect — this job's job is to get a build in front of testers.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  BUNDLE_ID: ai.rioeditor.editor

jobs:
  publish:
    name: Archive and upload to TestFlight
    runs-on: macos-26
    environment: app-store

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Check the tag matches RioVersion
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          rio=$(sed -n 's:.*<RioVersion>\(.*\)</RioVersion>.*:\1:p' Directory.Build.props | head -1 | tr -d ' ')
          if [ "$tag" != "$rio" ]; then
            echo "Tag '$tag' does not match RioVersion '$rio' in Directory.Build.props." >&2
            exit 1
          fi
          echo "tag $tag matches RioVersion $rio"

      - name: Install the iOS workload
        run: sudo dotnet workload install ios

      # Into a throwaway keychain rather than the login one: the runner is discarded, but a
      # named keychain keeps the certificate from colliding with anything else on it.
      - uses: Apple-Actions/import-codesign-certs@v7.0.0
        with:
          keychain: rioeditor-ios
          create-keychain: true
          p12-file-base64: ${{ secrets.APPLE_DIST_CERT_P12 }}
          p12-password: ${{ secrets.APPLE_DIST_CERT_PASSWORD }}

      # The iOS chain needs Apple WWDR. A hosted runner usually has it, but an absent
      # intermediate fails the same opaque way the Developer ID one does on macOS.
      - name: Install Apple's intermediate certificate
        run: |
          curl -fsSL -o "$RUNNER_TEMP/AppleWWDRCAG3.cer" https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
          security import "$RUNNER_TEMP/AppleWWDRCAG3.cer" -k rioeditor-ios.keychain-db -T /usr/bin/codesign 2>/dev/null || true

      - uses: Apple-Actions/download-provisioning-profiles@v6.1.0
        with:
          bundle-id: ${{ env.BUNDLE_ID }}
          profile-type: IOS_APP_STORE
          issuer-id: ${{ secrets.ASC_ISSUER_ID }}
          api-key-id: ${{ secrets.ASC_KEY_ID }}
          api-private-key: ${{ secrets.ASC_PRIVATE_KEY }}

      # RioBuild becomes CFBundleVersion. App Store Connect refuses a build number it has
      # already seen, so github.run_number drives it rather than the checked-in value.
      #
      # No ArchiveOnBuild here: that is a legacy Xamarin property and does not exist in the
      # .NET 10 iOS SDK. Publishing sets BuildIpa itself, and IpaPackageDir defaults to the
      # publish directory, which is what the next step searches.
      # The profile's name is whatever it was called in the developer portal, which the workflow
      # cannot know. Hardcoding a guess means signing fails on a name mismatch, so read the name
      # out of the profile that was actually downloaded for this bundle identifier.
      - name: Resolve the provisioning profile
        run: |
          dir="$HOME/Library/MobileDevice/Provisioning Profiles"
          name=""
          for profile in "$dir"/*.mobileprovision; do
            [ -e "$profile" ] || continue
            plist=$(security cms -D -i "$profile" 2>/dev/null) || continue
            appid=$(printf '%s' "$plist" | plutil -extract Entitlements.application-identifier raw - 2>/dev/null) || continue
            case "$appid" in
              *".$BUNDLE_ID")
                name=$(printf '%s' "$plist" | plutil -extract Name raw - 2>/dev/null)
                break ;;
            esac
          done
          if [ -z "$name" ]; then
            echo "::error::No provisioning profile for $BUNDLE_ID was downloaded. Check that the" \
                 "bundle identifier is registered and an App Store profile exists for it."
            ls -la "$dir" 2>/dev/null || true
            exit 1
          fi
          echo "Using provisioning profile: $name"
          echo "PROFILE_NAME=$name" >> "$GITHUB_ENV"

      # MSBuild's failure for a certificate/profile mismatch is "No iOS signing identities match
      # the specified provisioning profile", raised only after the archive has run. A profile names
      # the exact certificates it accepts, and the keychain says which are present, so the mismatch
      # is knowable up front -- and the useful part is *which* certificate was expected.
      - name: Check the certificate matches the profile
        run: |
          dir="$HOME/Library/MobileDevice/Provisioning Profiles"
          profile=$(grep -rl . "$dir"/*.mobileprovision 2>/dev/null | head -1)
          [ -n "$profile" ] || { echo "::error::No provisioning profile on disk"; exit 1; }

          wanted=$(security cms -D -i "$profile" 2>/dev/null | plutil -convert xml1 -o - - | python3 -c "
import sys, re, base64, subprocess
xml = sys.stdin.read()
block = re.search(r'<key>DeveloperCertificates</key>\s*<array>(.*?)</array>', xml, re.S)
for blob in re.findall(r'<data>(.*?)</data>', block.group(1), re.S) if block else []:
    der = base64.b64decode(re.sub(r'\s', '', blob))
    out = subprocess.run(['openssl', 'x509', '-inform', 'DER', '-noout', '-serial'],
                         input=der, capture_output=True).stdout.decode()
    print(out.strip().split('=')[1])
")
          present=$(security find-certificate -a -c "Apple Distribution" -p | \
                    awk '/BEGIN/{n++} {print > ("/tmp/c" n ".pem")} END{}' ; \
                    for f in /tmp/c*.pem; do openssl x509 -in "$f" -noout -serial 2>/dev/null | cut -d= -f2; done)

          echo "Profile accepts: $wanted"
          echo "Keychain holds : $present"
          for w in $wanted; do
            case "$present" in *"$w"*) echo "Match on $w"; exit 0 ;; esac
          done
          echo "::error::The signing certificate in APPLE_DIST_CERT_P12 is not one this profile" \
               "accepts. The profile expects serial(s): $wanted. Re-export the .p12 from the" \
               "Apple Distribution identity with that serial and update the secret."
          exit 1

      - name: Archive the iOS app
        run: |
          dotnet publish src/RioEditor.iOS -c Release -f net10.0-ios -r ios-arm64 \
            -p:RioBuild=${{ github.run_number }} \
            -p:CodesignProvision="$PROFILE_NAME" \
            -p:CodesignKey="Apple Distribution" \
            -o publish/ios

      - name: Find the IPA
        id: ipa
        run: echo "path=$(find publish/ios -name '*.ipa' | head -1)" >> "$GITHUB_OUTPUT"

      - name: Keep the IPA
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-ipa
          path: publish/ios/*.ipa
          if-no-files-found: error
          retention-days: 30

      - uses: Apple-Actions/upload-testflight-build@v5.3.0
        with:
          app-path: ${{ steps.ipa.outputs.path }}
          app-type: ios
          issuer-id: ${{ secrets.ASC_ISSUER_ID }}
          api-key-id: ${{ secrets.ASC_KEY_ID }}
          api-private-key: ${{ secrets.ASC_PRIVATE_KEY }}
