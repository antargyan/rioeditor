<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>RioEditor</title>
  <base href="/" />
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="icon-256.png" />
  <meta name="theme-color" content="#1a4fe0" />
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #ffffff; }
    #out { position: absolute; inset: 0; }

    /* The editor iframe is layered over the Avalonia canvas and positioned by
       BrowserEditorSurface; see rio-interop.js. */
    #rio-editor-frame {
      position: absolute;
      border: 0;
      margin: 0;
      padding: 0;
      background: transparent;
      z-index: 10;
    }

    #rio-splash {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #656d76; z-index: 100; background: #ffffff;
    }
  </style>
</head>
<body>
  <div id="rio-splash">Loading RioEditor…</div>
  <div id="out"></div>
  <script type="module" src="./main.js"></script>
</body>
</html>
